name: Build

# On every push: run checks, publish the web build to GitHub Pages and
# build Android APK (for sideloading) + AAB (for Google Play) into the
# "preview" GitHub Release.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Queue instead of cancelling: every push to the main branch gets its APK.
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Validate opening packs
        run: npm run pack:check
      - name: Check translations
        run: npm run i18n:check
      - name: Check moves mentioned in comments
        run: npm run pack:check-texts -- --all

  web:
    needs: checks
    # Only the default branch deploys the public site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export static site
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          CI: '1'
        run: npx expo export --platform web --output-dir dist
      - name: PWA (manifest, offline service worker)
        run: npx tsx tools/web/pwa.ts apps/mobile/dist "/${{ github.event.repository.name }}"
      - name: Prepare for GitHub Pages
        working-directory: apps/mobile/dist
        run: |
          # Files under _expo/ would be dropped by Jekyll.
          touch .nojekyll
          # Unknown paths fall back to the app's not-found route.
          if [ -f '+not-found.html' ]; then cp '+not-found.html' 404.html; fi
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/mobile/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  android:
    needs: checks
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          CI: '1'
        run: npx expo prebuild --platform android --no-install --clean

      # Optional: sign with your own key (secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
      # Without them the release build is signed with the debug key (fine for sideloading).
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          python3 tools/android-signing.py apps/mobile/android/app/build.gradle

      - name: Build APK and AAB
        working-directory: apps/mobile/android
        # Release builds are signed with the debug key for now (fine for testing / sideloading).
        # Play Store upload signing is added with module 31.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease bundleRelease
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/chess-open.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab out/chess-open.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: out/
          retention-days: 14

      # One release per build (tags are never reused, so this also works with
      # immutable releases). Stable link to the newest APK:
      #   https://github.com/<owner>/<repo>/releases/latest/download/chess-open.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          # The releases API sometimes answers 403 for a moment: retry.
          for i in 1 2 3 4; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" out/chess-open.apk out/chess-open.aab \
              --verify-tag \
              --latest \
              --title "Сборка #${{ github.run_number }}" \
              --notes "Тестовая сборка из ${GITHUB_SHA::7}. **APK** — установить на телефон напрямую. **AAB** — для Google Play (подписан release-ключом, если заданы секреты ANDROID_KEYSTORE_*)." \
              && break
            [ "$i" = 4 ] && exit 1
            sleep $((i * 20))
          done

      - name: Keep only the 5 newest builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes || true; done
